[build-system]

requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plantdrp"
version = "1.0.4"
description = "Prediction of Plant Disease Resistance Proteins using ProtT5 and SVM"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Prabina Kumar Meher", email = "meherprabin@yahoo.com"},
  {name = "Upendra Kumar Pradhan", email = "upen4851@gmail.com"},
  {name = "Aanchal Gupta", email = "aanchal.gupta2699@gmail.com"},
  {name = "Shubham Kumar", email = "shubham.kum3105@gmail.com"},
  {name = "Arzoo Kumari", email = "arzookumari91@gmail.com"}
]
keywords = [
  "bioinformatics",
  "plant immunity",
  "disease resistance",
  "protein prediction",
  "ProtT5",
  "SVM"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "torch>=2.0",
  "transformers>=4.38",
  "sentencepiece>=0.1.99",
  "scikit-learn>=1.3",
  "biopython>=1.81",
  "pandas>=1.5",
  "numpy>=1.24",
  "typer>=0.9",
  "tiktoken",
  "tqdm>=4.65",
  "uvicorn",
  "requests",
  "fastapi",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "protobuf"
]


[project.optional-dependencies]
ui = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "plotly>=5.18",
]
[project.scripts]
plantdrp = "plantdrp.cli:app"

[project.urls]
Homepage = "https://github.com/PrabinaMeher/plantDRP"
Repository = "https://github.com/PrabinaMeher/plantDRP"

[tool.setuptools.packages.find]
where = ["."]


[tool.setuptools.package-data]
plantdrp = [
  "models/*.pkl",
  "models/*.json",
  "web/*.html",
  "Dataset/*.zip"
]
